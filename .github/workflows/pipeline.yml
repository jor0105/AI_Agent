---
name: CI - Quality & Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        # v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # --------------------------------------------------------------------------
      # 1. Project Integrity Checks
      # --------------------------------------------------------------------------
      - name: Validate project lock file
        run: uv lock --check

      # --------------------------------------------------------------------------
      # 2. Security Checks
      # --------------------------------------------------------------------------
      - name: Security analysis with Bandit
        run: |
          uv run bandit -c pyproject.toml -r src -ll
          echo "✅ Security analysis passed"

      - name: Check for vulnerable dependencies
        run: |
          uv run pip-audit
          echo "✅ No vulnerable dependencies found"

      # --------------------------------------------------------------------------
      # 3. Code Quality & Formatting
      # --------------------------------------------------------------------------
      - name: Run pre-commit (all hooks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check with mypy
        run: uv run mypy src --pretty

      - name: Docstring style check
        run: |
          uv run pydocstyle src --convention=google \
            --add-ignore=D100,D104,D107
          echo "✅ Docstring style check passed"

      # --------------------------------------------------------------------------
      # 4. Tests
      # --------------------------------------------------------------------------
      - name: Run tests (excluding integration and slow tests)
        env:
          PYTHONPATH: .
        run: |
          uv run pytest -m "not integration and not slow" \
                 --cov=src --cov-report=xml --cov-report=term-missing \
                 --cov-fail-under=85

      - name: Upload coverage to Codecov
        # v4
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./coverage.xml
          flags: unittests
          name: Python ${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: false

      - name: Upload coverage report (artifact)
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
