[project]
name = "createagents"
version = "0.2.0"
description = "A powerful and accessible framework for creating AI agents and automation workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jordan Estralioto", email = "estraliotojordan@gmail.com" }
]
keywords = [
    "ai",
    "agents",
    "framework",
    "orchestration",
    "llm",
    "nlp",
    "automation",
    "multi-agent",
    "openai",
    "ollama",
    "generative-ai",
    "assistant",
    "bot"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries"
]


requires-python = ">=3.12,<4.0"

dependencies = [
    "openai>=2.7.1,<3.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "ollama>=0.6.0,<1.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "rich>=13.0.0,<16.0.0"
]

[project.optional-dependencies]
file-tools = [
    "tiktoken>=0.8.0,<1.0.0",
    "unstructured[pdf,docx,pptx]>=0.16.9,<1.0.0",
    "pandas>=2.2.3,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pyarrow>=18.1.0,<19.0.0",
    "chardet>=5.2.0,<6.0.0"
]
all = [
    "tiktoken>=0.8.0,<1.0.0",
    "unstructured[pdf,docx,pptx]>=0.16.9,<1.0.0",
    "pandas>=2.2.3,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pyarrow>=18.1.0,<19.0.0",
    "chardet>=5.2.0,<6.0.0"
]

[project.urls]
Homepage = "https://github.com/jor0105/Create-Agents-AI"
Repository = "https://github.com/jor0105/Create-Agents-AI"
Documentation = "https://github.com/jor0105/Create-Agents-AI"
"Bug Tracker" = "https://github.com/jor0105/Create-Agents-AI/issues"

[tool.setuptools.package-data]
createagents = ["*.txt", "*.md"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.11.0",
    "ruff>=0.16.2,<0.17.0",
    "bandit>=1.7.9",
    "pydocstyle>=6.3.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.5",
    "ipykernel>=7.1.0",
    "pip-audit>=2.9.0",
    "import-linter>=2.0",
    "grimp>=3.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Mechanical enforcement of the layering rules stated in AGENTS.md. Until now
# those rules were prose that only code review could catch.
[tool.importlinter]
root_package = "createagents"

[[tool.importlinter.contracts]]
name = "Clean Architecture layers point inward"
type = "layers"
containers = ["createagents"]
# Highest first. `main` is the composition root: it wires infra into the use
# cases and launches the CLI. `presentation` sits below it and depends on the
# `AgentFacade` protocol it declares itself, never on the concrete facade --
# that is what keeps the graph acyclic.
layers = ["main", "presentation", "infra", "application", "domain"]

# Redundant with the layers contract, but it fails with the exact wording of
# the AGENTS.md rule, which makes the violation obvious in a hook's output.
[[tool.importlinter.contracts]]
name = "application imports only domain"
type = "forbidden"
source_modules = ["createagents.application"]
forbidden_modules = [
    "createagents.infra",
    "createagents.main",
    "createagents.presentation",
]

# `utils` is shared by infra and presentation, so it must stay a leaf: an
# import from utils into any layer would make it a back door around the graph.
[[tool.importlinter.contracts]]
name = "utils is a dependency-free leaf"
type = "forbidden"
source_modules = ["createagents.utils"]
forbidden_modules = [
    "createagents.domain",
    "createagents.application",
    "createagents.infra",
    "createagents.main",
    "createagents.presentation",
]

[tool.pydocstyle]
convention = "google"
match = "(?!test_).*\\.py"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Every definition in `src` is annotated, so mypy checks all bodies instead
# of silently skipping untyped ones.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = [".venv"]

[tool.ruff]
# Blue style: 79 characters line length
line-length = 79

[tool.ruff.lint]
# Pinned explicitly so the result does not drift with Ruff's default ruleset
# between versions. Keep in sync with the ruff rev in .pre-commit-config.yaml.
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # import sorting
    "B",             # bugbear
    "C4",            # comprehensions
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RET",           # return statements
    "G", "LOG",      # logging correctness
    "DTZ",           # timezone-aware datetimes
    "PIE", "PERF",   # misc + performance
    "BLE",           # blind except
    "PYI",           # typing stubs correctness
    "ERA",           # commented-out code
    "TRY",           # exception handling
    "RUF",           # ruff-specific
]
ignore = [
    "E501",    # line length is owned by ruff-format
    "TRY003",  # long messages in raise: the project's exceptions are message-driven
    "TRY300",  # try/else restructuring: not worth churning the adapters
    "TRY301",  # raise-within-try is used deliberately in the retry/adapters flow
]

[tool.ruff.lint.per-file-ignores]
# Tests may use fixtures, looser typing, repetitive setup and standard
# exceptions as subjects under test. Correctness checks for blind catches,
# exception types and commented-out code remain enabled; intentional broad
# boundaries are marked locally with a rule-specific rationale.
"tests/**" = [
    "PERF",
    "RUF012", "RUF015", "RUF005", "RUF001",
    "SIM105", "SIM117", "SIM118", "SIM222",
    "RET", "UP015", "C401", "C403", "B007", "G201",
]

[tool.ruff.format]
# Blue style: Single quotes
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
