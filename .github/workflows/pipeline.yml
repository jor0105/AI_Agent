---
name: CI - Quality & Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            install_extras: true
            run_mypy: true
          - python-version: "3.13"
            install_extras: true
            run_mypy: true
          - python-version: "3.14"
            install_extras: false
            run_mypy: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        # v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.install_extras }}" == "true" ]]; then
            uv sync --locked --all-extras
          else
            # The optional document stack currently has no spaCy wheel for
            # CPython 3.14; validate the core package on that interpreter.
            uv sync --locked
          fi

      # --------------------------------------------------------------------------
      # 1. Project Integrity Checks
      # --------------------------------------------------------------------------
      - name: Validate project lock file
        run: uv lock --check

      # --------------------------------------------------------------------------
      # 2. Security Checks
      # --------------------------------------------------------------------------
      - name: Security analysis with Bandit
        run: |
          uv run --locked --no-sync bandit -c pyproject.toml -r src -ll
          echo "✅ Security analysis passed"

      - name: Check for vulnerable dependencies
        run: |
          uv run --locked --no-sync pip-audit --timeout 60
          echo "✅ No vulnerable dependencies found"

      # --------------------------------------------------------------------------
      # 3. Code Quality & Formatting
      # --------------------------------------------------------------------------
      - name: Run pre-commit (all hooks)
        run: >-
          uv run --locked --no-sync pre-commit run --all-files
          --show-diff-on-failure

      - name: Type check with mypy
        if: matrix.run_mypy == true
        run: |
          uv run --locked --no-sync mypy src --pretty
          uv run --locked --no-sync mypy tests scripts \
            --disable-error-code no-untyped-def --pretty

      - name: Resolve CI range
        id: ci-range
        run: |
          range=$(uv run --locked --no-sync python \
            scripts/quality_gates/resolve_ci_range.py)
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Check changed diff policy
        env:
          CI_RANGE: ${{ steps.ci-range.outputs.range }}
        run: |
          diff_allowlist=(
            scripts/check-import-cycles.py
            scripts/quality_gates/check_diff_sanity.py
            scripts/quality_gates/check_harness_projection.py
            scripts/quality_gates/check_lockfile_sync.py
            scripts/quality_gates/check_test_contracts.py
            scripts/quality_gates/check_test_integrity.py
            scripts/quality_gates/quality_gate_policy.py
            scripts/quality_gates/resolve_ci_range.py
            src/createagents/presentation/cli/ui/terminal_renderer.py
          )
          uv run --locked --no-sync python \
            scripts/quality_gates/check_diff_sanity.py \
            --range "$CI_RANGE" \
            "${diff_allowlist[@]/#/--allow-print-file=}"
          uv run --locked --no-sync python \
            scripts/quality_gates/check_test_integrity.py \
            --range "$CI_RANGE"

      - name: Check checked-out repository contracts
        run: |
          uv run --locked --no-sync python \
            scripts/quality_gates/check_test_contracts.py --revision HEAD
          uv run --locked --no-sync python \
            scripts/quality_gates/quality_gate_policy.py --revision HEAD
          uv run --locked --no-sync python \
            scripts/quality_gates/check_harness_projection.py --revision HEAD

      # --------------------------------------------------------------------------
      # 4. Tests
      # --------------------------------------------------------------------------
      - name: Run tests (excluding integration and slow tests)
        env:
          PYTHONPATH: .
        run: |
          uv run --locked --no-sync pytest -m "not integration and not slow" \
                 --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # v4
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./coverage.xml
          flags: unittests
          name: Python ${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: false

      - name: Upload coverage report (artifact)
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_CONFIG: ".gitleaks.toml"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
